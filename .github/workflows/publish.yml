name: Publish to npm

on:
  push:
    branches: [main]
  # Lets a failed publish be retried without pushing anything.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Asks the registry whether this exact version exists, instead of diffing
      # package.json against HEAD~1. The old diff treated a version bump as a
      # one-shot trigger: when the publish that followed it failed, the bump was
      # spent and no later push would retry it. That stranded 1.1.1, 1.2.0 and
      # 1.2.1 unpublished. This check is idempotent, so a failed publish simply
      # retries on the next push.
      - name: Check whether this version is already published
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          URL="https://registry.npmjs.org/${NAME//\//%2f}/$VERSION"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$URL")
          echo "GET $URL -> $CODE"

          case "$CODE" in
            200)
              echo "$NAME@$VERSION is already published; nothing to do"
              echo "should_publish=false" >> $GITHUB_OUTPUT
              ;;
            404)
              echo "$NAME@$VERSION is not on the registry; will publish"
              echo "should_publish=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Unexpected HTTP $CODE from the registry; refusing to guess whether $VERSION is published"
              exit 1
              ;;
          esac

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'

    # Must match the "Environment name" on the npmjs.com trusted publisher.
    # GitHub only adds an `environment` claim to the OIDC token when the job
    # declares one; npm requires that claim to equal the configured value, so a
    # mismatch makes the token exchange fail and npm falls back to no auth
    # (ENEEDAUTH). Blank on npmjs.com means this key must be absent.
    environment: NPM

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deliberately no registry-url. It makes setup-node write an .npmrc with
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and export the
      # placeholder NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX when the workflow
      # supplies no token. npm then authenticates with that placeholder and
      # never attempts the OIDC exchange, failing with a masked 404.
      # registry.npmjs.org is npm's default registry, so nothing is lost.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.x.
      # Pinned to 11.x: npm@latest is now 12.x, which requires Node >= 22.
      - name: Upgrade npm
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build library
        run: npm run build

      # Turns the two ways trusted publishing silently degrades into a clear
      # failure, rather than npm's masked "404 Not Found - PUT".
      - name: Preflight publish auth
        run: |
          echo "npm $(npm --version)"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set. npm prefers it over OIDC, so trusted publishing would be skipped."
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint. The job needs permissions: id-token: write."
            exit 1
          fi
          echo "No npm token configured and OIDC is available."

      # Authenticates via OIDC against the trusted publisher configured on npmjs.com
      # for this package (repo + this workflow filename). No token required.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.check-version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
