name: Publish to npm

on:
  push:
    branches: [main]
  # Lets a failed publish be retried without inventing a new version number.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version.outputs.changed }}
      new_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for version change
        id: version
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          # Get previous version from parent commit
          git checkout HEAD~1 -- package.json 2>/dev/null || true
          PREVIOUS_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
          git checkout HEAD -- package.json

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREVIOUS_VERSION"

          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deliberately no registry-url. It makes setup-node write an .npmrc with
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and export the
      # placeholder NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX when the workflow
      # supplies no token. npm then authenticates with that placeholder and
      # never attempts the OIDC exchange, failing with a masked 404.
      # registry.npmjs.org is npm's default registry, so nothing is lost.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.x.
      # Pinned to 11.x: npm@latest is now 12.x, which requires Node >= 22.
      - name: Upgrade npm
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build library
        run: npm run build

      # Turns the two ways trusted publishing silently degrades into a clear
      # failure, rather than npm's masked "404 Not Found - PUT".
      - name: Preflight publish auth
        run: |
          echo "npm $(npm --version)"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set. npm prefers it over OIDC, so trusted publishing would be skipped."
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint. The job needs permissions: id-token: write."
            exit 1
          fi
          echo "No npm token configured and OIDC is available."

      # Authenticates via OIDC against the trusted publisher configured on npmjs.com
      # for this package (repo + this workflow filename). No token required.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: Release v${{ needs.check-version.outputs.new_version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.check-version.outputs.new_version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
